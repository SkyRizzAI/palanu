# Built-in apps (app kinds and manifests). The views are the graphical apps; [defaults.command] gives every
# command of the nema table its kind and visibility. forge/packages/appgen compiles this file into apps/manifests.gen.c at
# build time; nothing parses TOML on the device. Edit here, then run: bun forge/packages/appgen/src/cli.ts
#
# caps: the manifest permissions a view holds (names as in docs/PAPP.md). kind: service | tty | gui.
# hidden = true keeps an entry out of the launcher; the launcher itself is a system view and is hidden.

[defaults.command]
kind = "tty"
hidden = true
api = 2

[[app]]
id = "launcher"
name = "Apps"
version = "1.0.0"
kind = "gui"
hidden = true
icon = "apps"
category = "System"

