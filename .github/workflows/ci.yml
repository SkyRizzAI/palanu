name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - run: bun install --frozen-lockfile
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }
      - name: No Co-Authored-By trailers
        run: |
          if git log --format=%B origin/main..HEAD 2>/dev/null | grep -qi '^co-authored-by:'; then
            echo "Co-Authored-By trailers are not allowed"; exit 1
          fi
      - run: ./pal check
      - run: ./pal test
      - name: Release rules
        run: bun test forge/tools/version.test.ts
  web: # on a push to main, pages.yml builds and tests the same (one browser build per push, not two)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.0 # the version refs/emsdk has (./pal web setup); "latest" would change the build under us
          actions-cache-folder: emsdk-cache
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: bun install --frozen-lockfile
      - name: Build the system for the browser
        run: emcmake cmake -S platform/web -B build/web && cmake --build build/web -j4
      - name: Build Web Forge and the simulator page
        run: bun forge/web/build.ts
      - name: Assemble the Pages site
        run: bun forge/web/site.ts --out _site
      - name: Simulator page tests
        run: cd forge/web && bun test src/sim
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The gitleaks CLI (MIT): gitleaks-action needs a registered license on an organization's repositories. The binary is
      # checked against the release's SHA-256 before it runs. A push scans its own commits, a PR the commits it adds.
      - name: Scan the new commits for secrets
        env:
          GITLEAKS: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if [ -n "$BASE" ]; then range="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="HEAD"; fi
          echo "scanning $range"
          ./gitleaks git --redact --verbose --exit-code 1 --log-opts="--no-merges $range" .
