name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - run: bun install --frozen-lockfile
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }
      - name: No Co-Authored-By trailers
        run: |
          if git log --format=%B origin/main..HEAD 2>/dev/null | grep -qi '^co-authored-by:'; then
            echo "Co-Authored-By trailers are not allowed"; exit 1
          fi
      - run: ./pal check
      - run: ./pal test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
